name: gttp

services:
  app:
    build: .
    image: ericfaris/gttp:latest
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8100:8100"
    # Chromium needs more shared memory than Docker's tiny 64M default, even
    # with --disable-dev-shm-usage as a fallback.
    shm_size: "512m"
    volumes:
      # Built static site — served by the container and what the tunnel exposes.
      - ./site:/app/site
      # Fetched-thread + synthesized-page cache (also holds the persistent
      # browser profile under browser-profile/), so restarts don't re-fetch.
      - ./.cache:/app/.cache
      # Catalog — edit on the host with `gttp add` or by hand; picked up on next build.
      - ./books.yaml:/app/books.yaml
      # Committed cover images — fetched via `gttp add`/`gttp covers`; bind-mounted
      # (not just baked into the image) so covers fetched inside the container
      # persist on the host and survive restarts without a rebuild.
      - ./covers:/app/covers
    environment:
      # Enables Claude ranking + synthesis; falls back to the heuristic
      # synthesizer without it.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=8100

  # Private book-submission form + queue status (behind Cloudflare Access at
  # submit-gttp.mooseflip.com). Same image as app, different command. It can
  # only write queue entries: no git, no keys, no Anthropic key, read-only
  # root FS, and .cache/queue is its only mount. The host-side worker
  # (systemd/gttp-worker.*) does the building, committing and pushing.
  submit:
    image: ericfaris/gttp:latest
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["python", "-m", "gttp.submit"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - ./.cache/queue:/app/.cache/queue
    environment:
      - GTTP_SUBMIT_PORT=8101
      - GTTP_SUBMIT_DAILY_CAP=${GTTP_SUBMIT_DAILY_CAP:-5}
      - GTTP_SUBMIT_MAX_QUEUED=${GTTP_SUBMIT_MAX_QUEUED:-3}
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8101/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
